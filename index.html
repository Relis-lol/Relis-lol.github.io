<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-code-reveal" aria-hidden="true">
  <pre class="code-layer" id="bg-code-text"></pre>
</div>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar__inner">
      <div class="avatar-wrap">
        <img class="avatar" id="avatar" src="" alt="" />
      </div>

      <h1 class="name" id="profile-name"></h1>
      <p class="role" id="profile-role"></p>
      <p class="role-secondary" id="profile-role-secondary"></p>
      <span class="status-pill" id="profile-status"></span>

      <div class="contact-list" id="contact-list"></div>

      <a class="cv-btn" id="cv-btn" href="#" target="_blank" rel="noopener" style="display:none">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/><path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 6.78a.75.75 0 1 1 1.06-1.06z"/></svg>
        <span>Lebenslauf</span>
      </a>

      <div class="cert-list" id="cert-list"></div>
    </div>
  </aside>

  <main class="main">
    <section class="hero">
      <h2 class="hero__heading" id="hero-heading"></h2>
      <p class="hero__text" id="hero-text"></p>

      <div class="hero__stats" id="hero-stats"></div>

      <div class="skills" id="skills"></div>
    </section>

    <section class="tiles" id="tiles"></section>
  </main>

</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__backdrop" id="modal-backdrop"></div>
  <div class="modal__panel" role="dialog" aria-modal="true">
    <button class="modal__close" id="modal-close" aria-label="Schließen">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
    </button>
    <div class="modal__stage" id="modal-stage"></div>
    <div class="modal__footer">
      <h3 class="modal__title" id="modal-title"></h3>
      <div class="modal__keywords" id="modal-keywords"></div>
      <div class="modal__dots" id="modal-dots"></div>
    </div>
  </div>
</div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
